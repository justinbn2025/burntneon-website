# Builds the site and publishes it to GitHub Pages on every push to main.
# To use: move this file to .github/workflows/deploy.yml, then in the repo set
# Settings > Pages > Source: "GitHub Actions".
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - run: python3 build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}   # where this build will be served: the preview address, or the domain once it is set
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
